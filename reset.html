<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07030d"><title>Reset AstroSathi Password</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 0,#3b1554,transparent 42%),#07030d;color:#fff8e7}.card{width:min(460px,calc(100% - 32px));padding:28px;border:1px solid #49305e;border-radius:26px;background:#100918;box-shadow:0 30px 90px #000a}.logo{font-size:28px;color:#ffd64f;font-weight:900}.tag{color:#ffd64f;margin:5px 0 25px}.muted{color:#a99aaf;line-height:1.55}.field{margin-top:16px}label{font-size:12px;color:#c8b9d1;font-weight:800}input{width:100%;height:56px;margin-top:7px;border:1px solid #513264;border-radius:15px;background:#09050f;color:white;padding:0 15px;font-size:16px}button{width:100%;height:56px;border:0;border-radius:16px;background:#ffd64f;color:#251500;font-size:16px;font-weight:900;margin-top:18px}.status{margin-top:15px;padding:12px;border-radius:12px;background:#171020;color:#d9cce2;display:none}.ok{color:#7be6a0}.bad{color:#ff8b8b}</style></head><body><main class="card"><div class="logo">ॐ AstroSathi</div><div class="tag">॥ ज्योतिषं परमं ज्ञानम् ॥</div><h1>Set a new password</h1><p class="muted">Choose a strong password with at least 8 characters. After resetting, return to the AstroSathi app and log in with the new password.</p><div class="field"><label>NEW PASSWORD</label><input id="p1" type="password" autocomplete="new-password"></div><div class="field"><label>CONFIRM PASSWORD</label><input id="p2" type="password" autocomplete="new-password"></div><button id="go">Reset Password</button><div id="status" class="status"></div></main><script>const AUTH='https://ep-orange-snow-a6j71rhq.neonauth.us-west-2.aws.neon.tech/neondb/auth';const q=new URLSearchParams(location.search);const token=q.get('token')||q.get('resetToken')||'';const s=document.getElementById('status');function show(m,ok){s.style.display='block';s.className='status '+(ok?'ok':'bad');s.textContent=m}document.getElementById('go').onclick=async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<8)return show('Password must contain at least 8 characters.',false);if(a!==b)return show('Passwords do not match.',false);if(!token)return show('The reset token is missing or expired. Start Forgot Password again from the app.',false);const btn=document.getElementById('go');btn.disabled=true;btn.textContent='Resetting…';try{const r=await fetch(AUTH+'/reset-password',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({token,newPassword:a})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||d.error?.message||'Reset failed. The link may have expired.');show('Password changed successfully. You can return to AstroSathi and log in now.',true);btn.textContent='Password Reset'}catch(e){show(e.message||String(e),false);btn.disabled=false;btn.textContent='Reset Password'}};</script></body></html>
