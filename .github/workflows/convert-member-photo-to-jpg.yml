name: Convert member photo to JPG

on:
  push:
    paths:
      - '.github/workflows/convert-member-photo-to-jpg.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert WebP to real JPEG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = 'member-photo.webp'
          dst = 'member-photo.jpg'
          img = Image.open(src).convert('RGB')
          img.save(dst, 'JPEG', quality=95, optimize=True)
          print('Created', dst, Image.open(dst).format)
          PY

      - name: Replace WebP with JPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f member-photo.webp
          git rm -f .github/workflows/convert-member-photo-to-jpg.yml
          git add member-photo.jpg
          git commit -m "Convert member-photo to JPG"
          git push
