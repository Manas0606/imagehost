name: Export jyotishg APK

on:
  push:
    branches: [agent/jyotishg-android]
    paths:
      - '.github/workflows/export-jyotishg-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages APK
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          sparse-checkout: |
            downloads/JyotishG.apk
            downloads/JyotishG.apk.sha256
          sparse-checkout-cone-mode: false

      - name: Verify and split published APK
        run: |
          test -s downloads/JyotishG.apk
          cd downloads
          sha256sum -c JyotishG.apk.sha256
          mkdir -p chunks
          split -b 8M -d -a 2 JyotishG.apk chunks/part-
          sha256sum chunks/part-* > chunks/SHA256SUMS
          ls -lh chunks/

      - name: Upload chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-part-00
          path: downloads/chunks/part-00
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-part-01
          path: downloads/chunks/part-01
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-part-02
          path: downloads/chunks/part-02
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 03
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-part-03
          path: downloads/chunks/part-03
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 04
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-part-04
          path: downloads/chunks/part-04
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 05
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-part-05
          path: downloads/chunks/part-05
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 06
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-part-06
          path: downloads/chunks/part-06
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 07
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-part-07
          path: downloads/chunks/part-07
          compression-level: 0
          retention-days: 1
      - name: Upload chunk checksums
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-chunk-checksums
          path: downloads/chunks/SHA256SUMS
          retention-days: 1
