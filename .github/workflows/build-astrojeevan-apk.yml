name: Build AstroJeevan APK

on:
  push:
    branches: [astrojeevan-flutter-build]
    paths:
      - 'astrojeevan/**'
      - '.github/workflows/build-astrojeevan-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrojeevan
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android and iOS platform folders
        run: flutter create . --platforms=android,ios --org com.astrojeevan --project-name astrojeevan
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstroJeevan-release-apk
          path: astrojeevan/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
