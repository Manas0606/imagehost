name: App Control Sync (Legacy Manual Only)

# Legacy processor retained only for emergency/manual inspection.
# It must NOT poll Telegram on a schedule because AstroSathi Premium now uses
# a single webhook consumer. Running getUpdates alongside a webhook creates
# an approval race and can make the Android app miss admin decisions.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-control-sync-legacy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: runner
      - uses: actions/checkout@v4
        with:
          ref: astrosathi-control
          path: control
          fetch-depth: 0
      - name: Legacy manual Telegram premium decision processor
        run: python3 runner/.github/scripts/astrosathi_telegram_admin.py control/premium-control.json
      - name: Persist legacy premium entitlement state safely
        run: |
          cd control
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-control.json
          if git diff --cached --quiet; then
            echo 'No premium state changes.'
            exit 0
          fi
          git commit -m 'update premium control state'
          git pull --rebase origin astrosathi-control
          git push origin HEAD:astrosathi-control
