name: App Control Sync

# The Android app polls Telegram every few seconds while a request is pending so the
# user sees Approve/Reject immediately. This durable sync deliberately waits before
# reading Telegram updates, giving the phone first priority, then persists the same
# decision under users[email] for uninstall/reinstall recovery.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'astrosathi-build-tools-trigger.txt'

permissions:
  contents: write

concurrency:
  group: app-control-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: runner
      - uses: actions/checkout@v4
        with:
          ref: astrosathi-control
          path: control
          fetch-depth: 0
      - name: Give Android immediate approval priority
        run: |
          echo 'Waiting 45 seconds so a pending AstroSathi app can observe the Telegram callback first.'
          sleep 45
      - name: Persist Telegram decision to account entitlement
        run: python3 runner/.github/scripts/astrosathi_telegram_admin.py control/premium-control.json
      - name: Publish durable premium account state
        run: |
          cd control
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-control.json
          if git diff --cached --quiet; then
            echo 'No premium state changes.'
            exit 0
          fi
          git commit -m 'update premium control state'
          git pull --rebase origin astrosathi-control
          git push origin HEAD:astrosathi-control

  astrosathi_tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK build tools
        run: |
          mkdir tools
          curl -L --fail -o tools/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          curl -L --fail -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -L --fail -o tools/r8lib.jar https://storage.googleapis.com/r8-releases/raw/8.7.18/r8lib.jar
      - uses: actions/upload-artifact@v4
        with:
          name: astrosathi-apk-tools
          path: tools/
          retention-days: 1
