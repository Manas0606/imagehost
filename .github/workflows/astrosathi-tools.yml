name: AstroSathi Build Tools
on:
  push:
    branches: [astrosathi-build-tools-20260826]
  workflow_dispatch:
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download tools
        run: |
          mkdir tools
          curl -L --fail -o tools/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          curl -L --fail -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -L --fail -o tools/r8lib.jar https://storage.googleapis.com/r8-releases/raw/8.7.18/r8lib.jar
      - uses: actions/upload-artifact@v4
        with:
          name: astrosathi-apk-tools
          path: tools/
          retention-days: 1
