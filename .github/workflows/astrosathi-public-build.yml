name: jyotishg Android Public Build

on:
  push:
    branches: [agent/jyotishg-android]
    paths:
      - 'mobile/**'
      - 'pages/**'
      - '.github/workflows/jyotishg-public-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  RN_VERSION: '0.86.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify jyotishg source
        run: |
          test -f mobile/App.tsx
          test -f mobile/astrology.ts
          test -f mobile/guidance.ts
          test -f mobile/mini-ai.ts
          test -f mobile/mini-ai-engine.ts
          test -f mobile/local-ai-model.ts
          test -f mobile/local-ai-regression.ts
          test -f mobile/chat-engine-regression.ts
          test -f mobile/life-patterns-regression.ts
          test -f mobile/accuracy-tests.ts
          test -f mobile/AstroNativeModule.kt
          test -f mobile/AstroNativePackage.kt
          test -f mobile/install-overlay.py
          test -f mobile/set-premium-duration-30m-v1.py
          test -f pages/index.html

      - name: Verify live Premium is 30 minutes
        run: |
          curl --fail --silent --show-error --max-time 20 \
            'https://raw.githubusercontent.com/Manas0606/imagehost/jyotishg-control/premium-control.json' \
            | python3 -c "import json,sys; x=json.load(sys.stdin); assert int(x['config']['durationMinutes'])==30; print('Live Premium duration: 30 minutes')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate React Native Android project
        run: |
          mkdir -p generated
          cd generated
          npx --yes @react-native-community/cli@latest init JyotishG --version $RN_VERSION --skip-install --package-name com.jyotishg

      - name: Install jyotishg app overlay
        run: python3 mobile/install-overlay.py

      - name: Verify generated 30-minute Premium flow
        run: |
          grep -Fq 'DEFAULT_PREMIUM_DURATION_MINUTES = 30' generated/JyotishG/premium.ts
          grep -Fq 'durationMinutes=safePositiveInt(state.durationMinutes,DEFAULT_PREMIUM_DURATION_MINUTES)' generated/JyotishG/premium.ts
          grep -Fq 'premium.durationMinutes||30' generated/JyotishG/App.tsx
          ! grep -Fq 'premium.durationMinutes||360' generated/JyotishG/App.tsx
          echo 'Generated Premium display and approval expiry are locked to current 30-minute configuration.'

      - name: Install dependencies
        working-directory: generated/JyotishG
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        working-directory: generated/JyotishG
        run: npx tsc --noEmit

      - name: Astrology, local AI, chat engine and life-pattern regression checks
        working-directory: generated/JyotishG
        run: |
          npx --yes tsx@4.20.3 accuracy-tests.ts
          npx --yes tsx@4.20.3 local-ai-regression.ts
          npx --yes tsx@4.20.3 chat-engine-regression.ts
          npx --yes tsx@4.20.3 life-patterns-regression.ts

      - name: Build release APK
        working-directory: generated/JyotishG/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare public site
        run: |
          APK=generated/JyotishG/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          mkdir -p _site/downloads
          cp "$APK" _site/downloads/JyotishG.apk
          cp pages/index.html _site/index.html
          sha256sum _site/downloads/JyotishG.apk | tee _site/downloads/JyotishG.apk.sha256
          du -h _site/downloads/JyotishG.apk

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-Android-APK
          path: |
            _site/downloads/JyotishG.apk
            _site/downloads/JyotishG.apk.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
