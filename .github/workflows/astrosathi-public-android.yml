name: jyotishg Public Android Build (Manual Legacy)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jyotishg-android-publish
  cancel-in-progress: false

env:
  RN_VERSION: '0.86.0'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/jyotishg-android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate React Native project
        run: |
          mkdir -p generated
          cd generated
          npx --yes @react-native-community/cli@latest init JyotishG --version $RN_VERSION --skip-install --package-name com.jyotishg

      - name: Install jyotishg overlay
        run: python3 mobile/install-overlay.py

      - name: Install dependencies
        working-directory: generated/JyotishG
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        working-directory: generated/JyotishG
        run: npx tsc --noEmit

      - name: Build release APK
        working-directory: generated/JyotishG/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare public site
        run: |
          test -f generated/JyotishG/android/app/build/outputs/apk/release/app-release.apk
          rm -rf public-site
          mkdir -p public-site/downloads
          cp pages/index.html public-site/index.html
          cp generated/JyotishG/android/app/build/outputs/apk/release/app-release.apk public-site/downloads/JyotishG.apk
          sha256sum public-site/downloads/JyotishG.apk | sed 's#public-site/downloads/##' > public-site/downloads/JyotishG.apk.sha256
          touch public-site/.nojekyll

      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public-site
          git init
          git checkout -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "publish: jyotishg Android APK ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
