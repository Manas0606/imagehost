name: AstroSathi Neon Secret Check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check available database credentials without printing values
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          PG_CONNECTION_STRING: ${{ secrets.PG_CONNECTION_STRING }}
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        shell: bash
        run: |
          : > result.txt
          for n in NEON_API_KEY DATABASE_URL NEON_DATABASE_URL POSTGRES_URL PG_CONNECTION_STRING NEON_DB_URL; do
            if [ -n "${!n:-}" ]; then echo "$n=SET" >> result.txt; else echo "$n=NOT_SET" >> result.txt; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: astrosathi-neon-secret-check
          path: result.txt
          retention-days: 1
