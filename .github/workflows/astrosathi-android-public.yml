name: AstroSathi Android Public Build

on:
  push:
    branches: [agent/astrosathi-android]
    paths:
      - 'mobile/**'
      - 'pages/**'
      - '.github/workflows/astrosathi-android-public.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astrosathi-android-publish
  cancel-in-progress: true

env:
  RN_VERSION: '0.86.0'
  PREMIUM_SERVICE_URL: 'https://astrosathi-premium-webhook-3jdn6xuqi.vercel.app'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: agent/astrosathi-android
          fetch-depth: 0

      - name: Verify AstroSathi sources
        run: |
          test -f mobile/App.tsx
          test -f mobile/astrology.ts
          test -f mobile/premium.ts
          test -f mobile/premium-backend.ts
          test -f mobile/install-premium-backend-v1.py
          test -f mobile/auth.ts
          test -f mobile/guidance.ts
          test -f mobile/mini-ai.ts
          test -f mobile/mini-ai-engine.ts
          test -f mobile/local-ai-model.ts
          test -f mobile/local-ai-regression.ts
          test -f mobile/life-patterns.ts
          test -f mobile/life-patterns-regression.ts
          test -f mobile/location.ts
          test -f mobile/accuracy-tests.ts
          test -f mobile/AstroNativeModule.kt
          test -f mobile/AstroNativePackage.kt
          test -f mobile/install-overlay.py
          test -f mobile/install-kundli-explain-v1.py
          test -f mobile/install-life-patterns-v1.py
          test -f mobile/remove-pattern-setting-v1.py
          test -f mobile/fix-premium-account-recovery-v1.py
          test -f mobile/fix-premium-keyboard-v1.py
          test -f pages/index.html
          test -f pages/reset.html

      - name: Verify Premium webhook service and Neon persistence
        run: |
          echo 'Health response:'
          curl --silent --show-error --location --max-time 20 --write-out '\nHTTP %{http_code}\n' "$PREMIUM_SERVICE_URL/api/health" | tee /tmp/premium-health.txt
          grep -q '"ok":true' /tmp/premium-health.txt
          echo 'Status/DB response:'
          curl --silent --show-error --location --max-time 20 --write-out '\nHTTP %{http_code}\n' "$PREMIUM_SERVICE_URL/api/premium-status?email=ci-probe%40astrosathi.invalid&deviceId=ci-probe" | tee /tmp/premium-status.txt
          grep -q '"ok":true' /tmp/premium-status.txt
          echo 'Premium webhook + database status endpoint are healthy.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate React Native Android project
        run: |
          mkdir -p generated
          cd generated
          npx --yes @react-native-community/cli@latest init AstroSathi --version $RN_VERSION --skip-install --package-name com.astrosathi

      - name: Install AstroSathi overlay
        run: python3 mobile/install-overlay.py

      - name: Verify generated Premium transport
        run: |
          grep -q 'PREMIUM_SERVICE_URL' generated/AstroSathi/premium.ts
          grep -q '/api/premium-status' generated/AstroSathi/premium.ts
          grep -q '/api/premium-request' generated/AstroSathi/premium.ts
          ! grep -q 'getUpdates' generated/AstroSathi/premium.ts
          ! grep -q 'api.telegram.org/bot' generated/AstroSathi/premium.ts

      - name: Install JavaScript dependencies
        working-directory: generated/AstroSathi
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        working-directory: generated/AstroSathi
        run: npx tsc --noEmit

      - name: Deterministic astrology, location, local AI and life-pattern regression checks
        working-directory: generated/AstroSathi
        run: |
          npx --yes tsx@4.20.3 accuracy-tests.ts
          npx --yes tsx@4.20.3 local-ai-regression.ts
          npx --yes tsx@4.20.3 life-patterns-regression.ts

      - name: Build release APK
        working-directory: generated/AstroSathi/android
        run: |
          ok=0
          for attempt in 1 2 3; do
            echo "Gradle release build attempt ${attempt}/3"
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient Gradle/build failure; waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          test "$ok" = "1"

      - name: Prepare public site
        run: |
          APK=generated/AstroSathi/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          rm -rf public-dist
          mkdir -p public-dist/downloads
          cp pages/index.html public-dist/index.html
          cp pages/reset.html public-dist/reset.html
          cp "$APK" public-dist/downloads/AstroSathi.apk
          sha256sum public-dist/downloads/AstroSathi.apk | sed 's#public-dist/downloads/##' > public-dist/downloads/AstroSathi.apk.sha256
          date -u +'%Y-%m-%dT%H:%M:%SZ' > public-dist/build.txt
          echo "$GITHUB_RUN_ID" > public-dist/run.txt
          touch public-dist/.nojekyll
          ls -lh public-dist/downloads/AstroSathi.apk
          cat public-dist/downloads/AstroSathi.apk.sha256

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroSathi-Latest-APK
          path: |
            public-dist/downloads/AstroSathi.apk
            public-dist/downloads/AstroSathi.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish to gh-pages branch
        run: |
          rm -rf generated
          mkdir -p /tmp/astrosathi-site
          cp -R public-dist/. /tmp/astrosathi-site/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Manas0606@users.noreply.github.com'
          git checkout --orphan gh-pages-temp
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R /tmp/astrosathi-site/. .
          git add -A
          git commit -m 'publish: AstroSathi Android APK'
          git branch -M gh-pages
          git push --force origin gh-pages
