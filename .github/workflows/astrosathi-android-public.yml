name: jyotishg Android Public Build

on:
  push:
    branches: [jyotish-g]
    paths:
      - 'mobile/**'
      - 'pages/**'
      - '.github/workflows/jyotishg-android-public.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jyotishg-android-publish
  cancel-in-progress: true

env:
  RN_VERSION: '0.86.0'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: jyotish-g
          fetch-depth: 0

      - name: Verify jyotishg sources
        run: |
          test -f mobile/App.tsx
          test -f mobile/astrology.ts
          test -f mobile/auth.ts
          test -f mobile/guidance.ts
          test -f mobile/mini-ai.ts
          test -f mobile/mini-ai-engine.ts
          test -f mobile/local-ai-model.ts
          test -f mobile/local-ai-regression.ts
          test -f mobile/life-patterns.ts
          test -f mobile/life-patterns-regression.ts
          test -f mobile/location.ts
          test -f mobile/accuracy-tests.ts
          test -f mobile/AstroNativeModule.kt
          test -f mobile/AstroNativePackage.kt
          test -f mobile/install-overlay.py
          test -f mobile/install-kundli-explain-v1.py
          test -f mobile/install-life-patterns-v1.py
          test -f mobile/remove-pattern-setting-v1.py
          test -f mobile/remove-premium-v1.py
          test -f pages/index.html
          test -f pages/reset.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate React Native Android project
        run: |
          mkdir -p generated
          cd generated
          npx --yes @react-native-community/cli@latest init JyotishG --version $RN_VERSION --skip-install --package-name com.jyotishg

      - name: Install jyotishg overlay
        run: python3 mobile/install-overlay.py

      - name: Verify Premium, Telegram and admin flows are removed
        run: |
          ! grep -RniE 'Premium|PREMIUM_|Telegram|telegram|Admin|admin|UTR|UPI|QRCode|AstroSathiAdminBot' generated/JyotishG/App.tsx generated/JyotishG/package.json generated/JyotishG/android/app/src/main/AndroidManifest.xml
          ! grep -RniE 'Premium|PREMIUM_|Telegram|telegram|UTR|UPI|QRCode|AstroSathiAdminBot' generated/JyotishG/android/app/src/main/java/com/jyotishg/AstroNativeModule.kt
          grep -Fq 'askMiniAI(chart,text,l,previous)' generated/JyotishG/App.tsx
          grep -Fq 'MINI-AI ACTIVE' generated/JyotishG/App.tsx
          grep -Fq 'keyboardShouldPersistTaps="handled"' generated/JyotishG/App.tsx
          echo 'Premium, Telegram, UPI and admin flows are absent; Jyotish G chat is unlocked.'

      - name: Install JavaScript dependencies
        working-directory: generated/JyotishG
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        working-directory: generated/JyotishG
        run: npx tsc --noEmit

      - name: Deterministic astrology, location, local AI and life-pattern regression checks
        working-directory: generated/JyotishG
        run: |
          npx --yes tsx@4.20.3 accuracy-tests.ts
          npx --yes tsx@4.20.3 local-ai-regression.ts
          npx --yes tsx@4.20.3 life-patterns-regression.ts

      - name: Build release APK
        working-directory: generated/JyotishG/android
        run: |
          ok=0
          for attempt in 1 2 3; do
            echo "Gradle release build attempt ${attempt}/3"
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient build failure; retrying in 20 seconds..."
              sleep 20
            fi
          done
          test "$ok" = "1"

      - name: Prepare public site
        run: |
          APK=generated/JyotishG/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          rm -rf public-dist
          mkdir -p public-dist/downloads
          cp pages/index.html public-dist/index.html
          cp pages/reset.html public-dist/reset.html
          cp "$APK" public-dist/downloads/JyotishG.apk
          sha256sum public-dist/downloads/JyotishG.apk | sed 's#public-dist/downloads/##' > public-dist/downloads/JyotishG.apk.sha256
          date -u +'%Y-%m-%dT%H:%M:%SZ' > public-dist/build.txt
          echo "$GITHUB_RUN_ID" > public-dist/run.txt
          touch public-dist/.nojekyll
          ls -lh public-dist/downloads/JyotishG.apk
          cat public-dist/downloads/JyotishG.apk.sha256

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jyotishg-Latest-APK
          path: |
            public-dist/downloads/JyotishG.apk
            public-dist/downloads/JyotishG.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish to gh-pages branch
        run: |
          rm -rf generated
          mkdir -p /tmp/jyotishg-site
          cp -R public-dist/. /tmp/jyotishg-site/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages-temp
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R /tmp/jyotishg-site/. .
          git add -A
          git commit -m 'publish: jyotishg Android APK'
          git branch -M gh-pages
          git push --force origin gh-pages
